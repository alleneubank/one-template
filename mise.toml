[settings]
lockfile = true
lockfile_platforms = ["linux-x64", "linux-arm64", "macos-x64", "macos-arm64"]

[tools]
# Bun is the package manager, runtime, test runner, and type checker. Keep this
# pin in step with `engines.bun` and the `@types/bun` version in package.json.
bun = "1.4.5"
"github:tilt-dev/tilt" = "0.37.9"
"aqua:evilmartians/lefthook" = "2.2.2"
"aqua:jqlang/jq" = "1.8.2"
"aqua:BurntSushi/ripgrep" = "15.2.0"
# 0.13.0 ships no macOS builds, so the weekly bump skips coreutils; see
# .github/workflows/update-deps.yml.
"aqua:uutils/coreutils" = "0.12.0"
# silo runs each worktree's dev stack (Tilt, ports, simulator and emulator
# slots); its Tilt integration needs janitor on PATH. silo needs a running
# Docker engine (OrbStack on macOS) even without k3d.
"npm:@0xbigboss/silo" = "1.4.0"
"github:alleneubank/janitor" = "0.3.1"
# One's CLI and dev server run on Node, not Bun's runtime.
node = "24.22.3"
# `bun run verify` drives the web app with agent-browser and the native apps
# with agent-device.
"npm:agent-browser" = "0.44.0"
"npm:agent-device" = "0.21.42"

[env]
PLAYWRIGHT_SKIP_VALIDATE_HOST_REQUIREMENTS = "{% if os() == 'linux' %}true{% else %}{{ get_env(name='PLAYWRIGHT_SKIP_VALIDATE_HOST_REQUIREMENTS', default='') }}{% endif %}"
